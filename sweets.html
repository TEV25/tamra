<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>خيمة وتمرة - الحلويات التراثية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo" onclick="location.href='index.html'">
            <img src="1000030008.png" alt="شعار خيمة وتمرة" class="logo-img">
            <span class="logo-text">خيمة وتمرة</span>
        </div>
        <div class="dropdown">
            <button class="dropbtn">☰ القائمة</button>
            <div class="dropdown-content">
                <a href="index.html">🏠 الرئيسية</a>
                <a href="sakhanat.html">🔥 السخانات</a>
                <a href="sweets.html" class="active">🍰 الحلويات</a>
                <a href="packages.html">✨ الباقات</a>
            </div>
        </div>
        <div class="nav-cart" onclick="toggleCart()">🛒 <span id="cartCountNav">0</span></div>
    </div>
</nav>

<div class="page-banner sweets-banner">
    <h1>🍰 الحلويات التراثية</h1>
    <p>ألذ الحلويات الشرقية الأصيلة</p>
</div>

<div class="products-grid" id="productsGrid"></div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div id="modalDetails"></div>
    </div>
</div>

<div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header"><h3>🛒 سلة مشترياتي</h3><span class="close-cart" onclick="toggleCart()">✖</span></div>
    <div id="cartItemsList" class="cart-items"></div>
    <div id="cartTotal" class="cart-total"></div>
    <button onclick="sendOrder()" class="btn-checkout">📲 تأكيد الطلب</button>
</div>
<div id="cartOverlay" class="cart-overlay" onclick="toggleCart()"></div>

<script src="script.js"></script>
<script>
    // عرض الحلويات فقط
    displayProductsByType('sweets');
</script>
</body>
</html>
